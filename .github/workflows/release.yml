name: Desktop release builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  CARGO_HTTP_MULTIPLEXING: false

jobs:
  windows:
    name: Windows x64
    runs-on: blacksmith-4vcpu-windows-2025
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-31
          targets: x86_64-pc-windows-msvc
      - name: Provide libclang for autocxx bindings
        shell: pwsh
        run: |
          # async-sevenz and async-rar run autocxx-bindgen, which needs
          # libclang. The Linux job gets it from libclang-dev; on Windows it is
          # only there when the runner image happens to ship LLVM, and the
          # Blacksmith image does not. Prefer a copy already on the image (VS
          # Build Tools bundles one), install LLVM only as a fallback, and pin
          # LIBCLANG_PATH so clang-sys does not have to guess.
          $roots = @(
            'C:\Program Files\LLVM\bin',
            'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin'
          )
          function Find-LibClang {
            foreach ($root in $roots) {
              if (Test-Path (Join-Path $root 'libclang.dll')) { return $root }
            }
            return $null
          }

          $llvmBin = Find-LibClang
          if (-not $llvmBin) {
            Write-Output 'libclang.dll not present on the image; installing LLVM'
            choco install llvm --no-progress --yes
            $llvmBin = Find-LibClang
          }
          if (-not $llvmBin) {
            throw "libclang.dll not found after installing LLVM; searched: $($roots -join '; ')"
          }
          Write-Output "Using libclang from $llvmBin"
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Export GitHub Actions cache environment for vcpkg
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL);
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN);
      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: Windows-vcpkg-x86-64-v3-static-md-release-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            Windows-vcpkg-x86-64-v3-static-md-release-v1-
      - name: Prepare vcpkg with retries
        shell: pwsh
        run: |
          # Reaching github.com from the Windows runners times out
          # intermittently: both run-vcpkg's clone and its bootstrap download of
          # vcpkg.exe have died on a ~21s connect timeout, failing a whole
          # release build. run-vcpkg has no retry of its own, so do the two
          # network steps here and hand it a directory already at the pinned
          # commit with vcpkg.exe built -- it then skips straight to install.
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          $dir = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
          $commit = '84bab45d415d22042bd0b9081aea57f362da3f35'

          function Invoke-WithRetry {
            param([string] $What, [scriptblock] $Action)
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & $Action
              if ($LASTEXITCODE -eq 0) { return }
              Write-Output "$What failed with exit $LASTEXITCODE (attempt $attempt of 5)"
              Start-Sleep -Seconds (5 * $attempt)
            }
            throw "$What did not succeed after 5 attempts"
          }

          if (-not (Test-Path (Join-Path $dir '.git'))) {
            Remove-Item -Recurse -Force $dir -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WithRetry 'vcpkg clone' {
              git clone https://github.com/microsoft/vcpkg.git -n $dir
            }
          }
          Invoke-WithRetry 'vcpkg checkout' { git -C $dir checkout --force $commit }
          if (-not (Test-Path (Join-Path $dir 'vcpkg.exe'))) {
            Invoke-WithRetry 'vcpkg bootstrap' {
              & (Join-Path $dir 'bootstrap-vcpkg.bat')
            }
          }
          Write-Output "vcpkg ready at $commit"
      - name: Install optimized static libtorrent
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          doNotUpdateVcpkg: true
          vcpkgJsonGlob: "vcpkg.json"
          runVcpkgInstall: true
        env:
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          VCPKG_DEFAULT_TRIPLET: x64-windows-v3-static-md-release
          VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
          VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/vcpkg-overlays
      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg_installed
          key: Windows-vcpkg-x86-64-v3-static-md-release-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --locked --release --package stremio-native
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          VCPKGRS_TRIPLET: x64-windows-v3-static-md-release
          PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-windows-v3-static-md-release/lib/pkgconfig
      - name: Stage app-local MSVC runtime
        shell: pwsh
        run: ./scripts/stage_windows_msvc_runtime.ps1 -BuildRoot ./target/release
      - name: Verify runtime bundle
        shell: pwsh
        run: |
          $root = "target/release"
          @("stremio-native.exe", "libmpv-2.dll", "licenses/mpv/LICENSE.GPL", "licenses/mpv/LICENSE.LGPL") | ForEach-Object {
            if (-not (Test-Path (Join-Path $root $_))) { throw "Missing release artifact: $_" }
          }
      - name: Provide Inno Setup for the installer
        shell: pwsh
        run: |
          # create_setup.cmd needs ISCC.exe. GitHub's Windows images ship Inno
          # Setup; the Blacksmith one does not, so install it when missing and
          # hand the script an explicit ISCC_EXE instead of letting it probe.
          $roots = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6",
            "$env:ProgramFiles\Inno Setup 6"
          )
          function Find-Iscc {
            foreach ($root in $roots) {
              $candidate = Join-Path $root 'ISCC.exe'
              if (Test-Path $candidate) { return $candidate }
            }
            return $null
          }

          $iscc = Find-Iscc
          if (-not $iscc) {
            Write-Output 'Inno Setup not present on the image; installing'
            choco install innosetup --no-progress --yes
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            throw "ISCC.exe not found after installing Inno Setup; searched: $($roots -join '; ')"
          }
          Write-Output "Using Inno Setup at $iscc"
          "ISCC_EXE=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build installer and updater archive
        shell: cmd
        run: |
          set "SKIP_BUILD=1"
          call setup\create_setup.cmd
      - uses: actions/upload-artifact@v7
        with:
          name: stremio-native-windows-x64
          path: |
            target/release/stremio-native.exe
            target/release/libmpv-2.dll
            target/release/msvc-runtime
            target/release/licenses/mpv
            artifacts/StremioSetup-v*-x64.exe
            artifacts/stremio-native-v*-x86_64-pc-windows-msvc.zip
          if-no-files-found: error

  linux:
    name: Linux x64
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_DEFAULT_TRIPLET: x64-linux-v3-static-release
      VCPKGRS_TRIPLET: x64-linux-v3-static-release
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/vcpkg-overlays
      PKG_CONFIG_PATH: ${{ github.workspace }}/vcpkg_installed/x64-linux-v3-static-release/lib/pkgconfig
      LIBTORRENT_STATIC: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-31
      - uses: Swatinem/rust-cache@v2
      - name: Restore apt cache
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/cache/apt/archives
          key: linux-apt-deps-v2
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake ninja-build pkg-config libssl-dev libclang-dev libgtk-3-dev libayatana-appindicator3-dev libmpv-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libwayland-dev libx11-xcb-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libegl1-mesa-dev
      - name: Save apt cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /var/cache/apt/archives
          key: linux-apt-deps-v2
      - name: Restore libtorrent cache
        id: libtorrent-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: Linux-vcpkg-x64-linux-v3-static-release-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
          restore-keys: |
            Linux-vcpkg-x64-linux-v3-static-release-v1-
      - name: Install static libtorrent 2.1.1
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          vcpkgDirectory: "${{ github.workspace }}/vcpkg"
          vcpkgJsonGlob: "vcpkg.json"
          runVcpkgInstall: true
      - name: Save libtorrent cache
        if: steps.libtorrent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg_installed
          key: Linux-vcpkg-x64-linux-v3-static-release-v1-${{ hashFiles('vcpkg.json', 'triplets/**', 'vcpkg-overlays/**') }}
      - name: Build release
        run: cargo build --locked --release --package stremio-native
      - name: Install cargo-deb
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-deb
      - name: Build DEB Package
        run: cargo deb --package stremio-native --no-build
      - uses: actions/upload-artifact@v7
        with:
          name: stremio-native-linux-x64
          path: target/release/stremio-native
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: stremio-native-linux-deb
          path: target/debian/*.deb
          if-no-files-found: error

  arch:
    name: Arch Linux x64
    needs: linux
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: stremio-native-linux-x64
          path: target/release
      - name: Install packaging dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm base-devel
      - name: Create PKGBUILD
        run: |
          pkgver=$(grep -m1 'version = ' app/Cargo.toml | cut -d '"' -f2)
          mkdir -p pkg
          cat > pkg/PKGBUILD << EOF
          # Maintainer: perpetus <perpetus.github@gmail.com>
          pkgname=stremio-native
          pkgver=${pkgver}
          pkgrel=1
          pkgdesc="High-performance native Stremio client built with Rust and Slint"
          arch=('x86_64')
          url="https://github.com/stremio-native/stremio-native"
          license=('GPL-3.0')
          depends=('openssl' 'mpv' 'gtk3' 'libayatana-appindicator' 'fontconfig' 'freetype2' 'libxkbcommon' 'libxcursor' 'libx11' 'wayland')
          options=('!strip' '!debug')
          source=("stremio-native")
          sha256sums=('SKIP')

          package() {
              install -Dm755 "\$srcdir/stremio-native" "\$pkgdir/usr/bin/stremio-native"
          }
          EOF
          cp target/release/stremio-native pkg/stremio-native
      - name: Build package
        run: |
          cd pkg
          mapfile -t runtime_deps < <(bash -c 'source ./PKGBUILD; printf "%s\n" "${depends[@]}"')
          pacman -S --needed --noconfirm "${runtime_deps[@]}"
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg --noconfirm"
      - name: Upload Arch Package
        uses: actions/upload-artifact@v7
        with:
          name: stremio-native-arch-pkg
          path: pkg/*.pkg.tar.zst
          if-no-files-found: error

  fedora:
    name: Fedora x64
    needs: linux
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: fedora:latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Linux binary
        uses: actions/download-artifact@v8
        with:
          name: stremio-native-linux-x64
          path: target/release
      - name: Restore dnf cache
        id: dnf-cache
        uses: actions/cache/restore@v6
        with:
          path: /var/cache/dnf
          key: fedora-dnf-rpm-build
      - name: Install packaging dependencies
        run: |
          dnf install -y rpm-build
      - name: Save dnf cache
        if: steps.dnf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: /var/cache/dnf
          key: fedora-dnf-rpm-build
      - name: Create RPM Spec
        run: |
          pkgver=$(grep -m1 'version = ' app/Cargo.toml | cut -d '"' -f2)
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp target/release/stremio-native rpmbuild/SOURCES/
          cat > rpmbuild/SPECS/stremio-native.spec << 'SPEC'
          Name:           stremio-native
          Version:        __VERSION__
          Release:        1%{?dist}
          Summary:        High-performance native Stremio client built with Rust and Slint
          License:        GPLv3
          URL:            https://github.com/stremio-native/stremio-native
          Source0:        stremio-native
          Requires:       openssl mpv-libs gtk3 libayatana-appindicator-gtk3 fontconfig freetype libxkbcommon libXcursor libX11 libwayland-client

          %description
          High-performance native Stremio client built with Rust and Slint.

          %install
          rm -rf %{buildroot}
          mkdir -p %{buildroot}%{_bindir}
          install -p -m 755 %{_sourcedir}/stremio-native %{buildroot}%{_bindir}/stremio-native

          %files
          %{_bindir}/stremio-native

          %changelog
          * Sun Jul 19 2026 perpetus <perpetus.github@gmail.com> - __VERSION__-1
          - Initial release
          SPEC
          sed -i "s/__VERSION__/$pkgver/g" rpmbuild/SPECS/stremio-native.spec
      - name: Validate RPM runtime dependencies
        run: |
          read -r -a runtime_deps <<< "$(sed -n 's/^Requires:[[:space:]]*//p' rpmbuild/SPECS/stremio-native.spec)"
          dnf install -y "${runtime_deps[@]}"
      - name: Build RPM Package
        run: |
          rpmbuild -bb rpmbuild/SPECS/stremio-native.spec --define "_topdir $(pwd)/rpmbuild"
      - name: Upload RPM Package
        uses: actions/upload-artifact@v7
        with:
          name: stremio-native-fedora-rpm
          path: rpmbuild/RPMS/x86_64/*.rpm
          if-no-files-found: error

  release:
    name: Publish tagged release
    needs: [windows, linux, arch, fedora]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          copy_latest() {
            local pattern="$1"
            local source
            source="$(find artifacts -type f -name "$pattern" | sort -V | tail -n 1)"
            if [[ -z "$source" ]]; then
              echo "Missing required release asset: $pattern" >&2
              exit 1
            fi
            cp "$source" release/
          }

          copy_latest "StremioSetup-v*-x64.exe"
          copy_latest "stremio-native-v*-x86_64-pc-windows-msvc.zip"
          copy_latest "*.deb"
          copy_latest "stremio-native-[0-9]*.pkg.tar.zst"
          copy_latest "*.rpm"

          linux_binary="$(find artifacts/stremio-native-linux-x64 -type f -name stremio-native | head -n 1)"
          if [[ -z "$linux_binary" ]]; then
            echo "Missing required Linux release binary" >&2
            exit 1
          fi
          linux_asset="release/stremio-native-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          cp "$linux_binary" "$linux_asset"
          chmod +x "$linux_asset"

          (cd release && sha256sum * > SHA256SUMS.txt)
          find release -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Prepare release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          python scripts/generate_release_notes.py \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --previous-tag "${previous_tag}" \
            --asset-dir release \
            --changelog CHANGELOG.md \
            --output "${GITHUB_WORKSPACE}/RELEASE_BODY.md"
          cat "${GITHUB_WORKSPACE}/RELEASE_BODY.md"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') || contains(github.ref, 'rc') }}
