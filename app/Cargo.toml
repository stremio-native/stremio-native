[package]
name = "stremio-native"
version = "1.0.6"
authors = ["perpetus <perpetus.github@gmail.com>"]
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
stremio-core.workspace = true
stream-server.workspace = true
core-env = { path = "../core-env" }
playback-mpv = { path = "../playback-mpv" }
server-connector = { path = "../server-connector" }
slint = { workspace = true, features = [
    "accessibility",
    "compat-1-2",
    "renderer-skia-opengl",
    "std",
    "system-tray",
    "unstable-winit-030",
] }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true, features = ["rt"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
futures.workspace = true
fluent-bundle.workspace = true
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
blake3.workspace = true
tracing.workspace = true
thiserror.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
tracing-chrome.workspace = true
url.workspace = true
unic-langid.workspace = true
walkdir.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["rustls", "charset", "http2"] }
rand.workspace = true
image = { workspace = true, default-features = false, features = ["webp", "png", "jpeg"] }
moka = { workspace = true, features = ["sync", "future"] }
notify.workspace = true
turso = { workspace = true }
chrono = { workspace = true }
chacha20poly1305.workspace = true
mimalloc = "0.1.52"
arboard = "3.6.1"
hex = "0.4.3"
open = "5.4.1"
percent-encoding.workspace = true
self_update.workspace = true
zip.workspace = true
sys-locale.workspace = true
uuid = { version = "1.24.0", features = ["v4"] }
discord-rich-presence = { workspace = true }
dirs.workspace = true
credential-store = { path = "../credential-store" }
debrid = { path = "../debrid" }
media-integrations = { path = "../media-integrations" }
stream-ranking = { path = "../stream-ranking" }
souvlaki = { workspace = true }
keepawake = { workspace = true }
rodio.workspace = true
mlua = { workspace = true, optional = true }
hotpath = { version = "0.23.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
# Ergonomic COM for the taskbar thumbnail toolbar (ITaskbarList3) and the
# notification-area tray host, plus D3D11 for the background GPU-driver pre-warm.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_RestartManager",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
] }


[build-dependencies]
slint-build.workspace = true
serde_json.workspace = true
winres = "0.1.12"

[features]
default = [
    "stremio-core/env-future-send",
    "core-env/default",
    "server-connector/default",
    "in-process",
]
in-process = ["core-env/in-process", "server-connector/in-process"]
plugins = ["dep:mlua"]
profiling = ["hotpath/hotpath", "hotpath/hotpath-alloc", "hotpath/tokio", "hotpath/reqwest-0-12"]

[package.metadata.deb]
maintainer = "perpetus <perpetus.github@gmail.com>"
copyright = "2026 perpetus <perpetus.github@gmail.com>"
extended-description = "High-performance native Stremio client built with Rust and Slint"
depends = "$auto, libmpv2 | libmpv1, libssl3 | libssl1.1, libfontconfig1, libfreetype6, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libgtk-3-0, libayatana-appindicator3-1"
section = "video"
priority = "optional"
assets = [
    ["target/release/stremio-native", "usr/bin/stremio-native", "755"],
]
